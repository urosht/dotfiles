# Copy/Paste configuration (Wayland clipboard via wl-copy)

set -g mode-keys vi

bind -T copy-mode-vi v   send -X begin-selection                                    # Start selection
bind -T copy-mode-vi C-v send -X rectangle-toggle                                   # Toggle selection mode
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "wl-copy"                     # Copy to clipboard

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy" \; send -X clear-selection
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
